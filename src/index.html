<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#d51d36"><title>A movie date?</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ctext y='32' font-size='32'%3E:)%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body>

<main>
<section id="invitation" class="scene" aria-labelledby="question"><span class="little-heart" aria-hidden="true">&lt;3</span><h1 id="question">will you go on a<br>movie date with me?</h1><div class="choices"><button id="yes" class="yes">Yes :)</button><span id="no-slot"><button id="no" class="no">No</button></span></div></section>
<section id="reveal" class="scene" aria-labelledby="reveal-title" hidden>
<h1 id="reveal-title" tabindex="-1">never doubted you :)</h1>
<figure class="reaction"><img src="her-reaction.jpeg" alt="Her perfectly unimpressed reaction" width="1600" height="900"></figure>
<p class="punchline">wow you picked yes all by yourself</p>
<div class="date"><p class="note-intro">we’re watching</p><h2>Before Sunrise</h2><p>Saturday, November 7 <span>·</span> 3 PM EST</p></div>
<a class="calendar" href="movie-date.ics" download="our-movie-date.ics">put it in your calendar</a><button id="replay" class="replay" aria-label="Replay invitation">do that again</button></section>
</main>
<svg id="rope" aria-hidden="true"><path/></svg><div id="bubble" aria-hidden="true" hidden></div><div id="face" class="face" data-mode="idle" aria-hidden="true"><div class="face-turn"><div class="upper"><img src="face.png" alt=""></div><div class="lower"><img src="face.png" alt=""></div></div><span class="anger">!</span></div><span id="status" class="sr-only" aria-live="polite"></span>
</body></html>
